<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textile Studio Pro</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="pro-theme">

    <!-- Top App Bar -->
    <header class="app-header">
        <div class="header-left">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 22h20L12 2z"/></svg>
            <span class="app-title">TextileStudio</span>
            <span class="divider">/</span>
            <span class="doc-title">Untitled Pattern</span>
        </div>
        <div class="header-right">
            <button id="btn-open-analyze" class="btn btn-secondary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                Legacy Analyzer
            </button>
            <button class="btn btn-primary" id="header-synthesize-btn">
                Export Fabric
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="workspace">
        
        <!-- Left Toolbar (Slim) -->
        <aside class="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" data-tool="rect" title="Rectangle (R)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                </button>
                <button class="tool-btn" data-tool="circle" title="Ellipse (O)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
                </button>
                <button class="tool-btn" data-tool="triangle" title="Triangle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,3 21,21 3,21"/></svg>
                </button>
                <button class="tool-btn" data-tool="diamond" title="Diamond">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 22,12 12,22 2,12"/></svg>
                </button>
                <button class="tool-btn" data-tool="hexagon" title="Hexagon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 21,7 21,17 12,22 3,17 3,7"/></svg>
                </button>
                <button class="tool-btn" data-tool="star" title="Star">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
                </button>
                <button class="tool-btn" data-tool="line" title="Line (L)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/></svg>
                </button>
            </div>
            
            <div class="tool-group mt-auto">
                <button class="tool-btn" id="undo-btn" title="Undo (Ctrl+Z)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
                </button>
                <button class="tool-btn text-danger" id="clear-btn" title="Clear Canvas">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
        </aside>

        <!-- Center Canvas Area -->
        <main class="canvas-area">
            <div class="canvas-board">
                <canvas id="design-canvas" width="600" height="600"></canvas>
            </div>
        </main>

        <!-- Right Properties Panel -->
        <aside class="properties-panel">
            
            <div class="panel-section">
                <div class="section-header">Live Tile Preview</div>
                <div class="preview-container">
                    <canvas id="preview-canvas" width="240" height="240"></canvas>
                    <button class="icon-btn overlay-btn" id="grid-toggle-btn" title="Toggle Grid">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18"/><path d="M12 3v18"/></svg>
                    </button>
                </div>
            </div>

            <div class="panel-section">
                <div class="section-header">Appearance</div>
                
                <div class="prop-row">
                    <span class="prop-label">Fill</span>
                    <div class="color-picker-wrap">
                        <input type="color" id="fill-color" value="#000000">
                        <span class="color-hex" id="fill-hex">#000000</span>
                    </div>
                    <label class="checkbox-wrap" title="Enable Fill">
                        <input type="checkbox" id="filled-toggle" checked>
                        <span class="checkmark"></span>
                    </label>
                </div>
                
                <div class="prop-row">
                    <span class="prop-label">Stroke</span>
                    <div class="color-picker-wrap">
                        <input type="color" id="stroke-color" value="#333333">
                        <span class="color-hex" id="stroke-hex">#333333</span>
                    </div>
                </div>

                <div class="prop-row">
                    <span class="prop-label">Weight</span>
                    <div class="slider-wrap">
                        <input type="range" id="stroke-width" min="0" max="20" value="2">
                        <input type="number" id="stroke-width-val" value="2" min="0" max="20">
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <div class="section-header">Canvas</div>
                <div class="prop-row">
                    <span class="prop-label">Background</span>
                    <div class="color-picker-wrap">
                        <input type="color" id="bg-color" value="#ffffff">
                        <span class="color-hex" id="bg-hex">#FFFFFF</span>
                    </div>
                </div>
            </div>

            <div class="panel-section mt-auto border-top">
                <div class="section-header">Export Configuration</div>
                
                <div class="export-grid">
                    <button class="export-preset active" data-w="2000" data-h="2000">
                        <span class="preset-name">Jersey Base</span>
                        <span class="preset-dim">2000 × 2000</span>
                    </button>
                    <button class="export-preset" data-w="1200" data-h="3600">
                        <span class="preset-name">Saree Roll</span>
                        <span class="preset-dim">1200 × 3600</span>
                    </button>
                    <button class="export-preset" data-w="3840" data-h="2160">
                        <span class="preset-name">4K Screen</span>
                        <span class="preset-dim">3840 × 2160</span>
                    </button>
                </div>

                <div class="custom-dims">
                    <div class="dim-input-group">
                        <label>W</label>
                        <input type="number" id="design-out-w" value="2000">
                    </div>
                    <div class="dim-link">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    </div>
                    <div class="dim-input-group">
                        <label>H</label>
                        <input type="number" id="design-out-h" value="2000">
                    </div>
                </div>
            </div>

        </aside>
    </div>

    <!-- Export Modal -->
    <div id="result-modal" class="modal hidden">
        <div class="modal-content result-modal-content">
            <div class="modal-header">
                <h3>Exported Fabric</h3>
                <button class="icon-btn" id="close-result-modal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            
            <div class="modal-body">
                <div class="loader-state" id="design-loader">
                    <div class="spinner"></div>
                    <p>Rendering high-resolution texture...</p>
                </div>
                
                <div id="design-result" class="hidden">
                    <div class="export-preview">
                        <img id="design-res-img" src="" alt="Synthesized Pattern">
                    </div>
                    <div class="export-actions">
                        <a id="design-download-btn" class="btn btn-primary w-full" download="fabric_pattern.png">Download HD Texture</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Legacy Analyzer Modal -->
    <div id="analyze-modal" class="modal hidden">
        <div class="modal-content result-modal-content">
            <div class="modal-header">
                <h3>Legacy Analyzer</h3>
                <button class="icon-btn" id="close-analyze-modal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="upload-form">
                    <div class="drop-zone" id="drop-zone">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <p>Drag image or <label for="file-input" class="text-link">browse</label></p>
                    </div>
                    <input type="file" id="file-input" accept="image/*" hidden>
                    
                    <div class="custom-dims mt-4">
                        <div class="dim-input-group">
                            <label>W</label>
                            <input type="number" id="out-w" value="1920">
                        </div>
                        <div class="dim-input-group">
                            <label>H</label>
                            <input type="number" id="out-h" value="1080">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-full mt-4" id="generate-btn">Synthesize Output</button>
                </form>

                <div class="loader-state hidden" id="loader">
                    <div class="spinner"></div>
                    <p>Detecting lattice...</p>
                </div>

                <div class="analyzer-results hidden" id="results">
                    <div class="mini-results">
                        <img id="res-original" src="" title="Original">
                        <img id="res-autocorr" src="" title="Autocorrelation">
                        <img id="res-tile" src="" title="Extracted Tile">
                    </div>
                    <img id="res-reconstructed" src="" class="main-result" title="Final Texture">
                    <a id="download-btn" class="btn btn-primary w-full mt-4" download="synthesized_texture.png">Download HD</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
